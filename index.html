<!doctype html>
<html lang="az"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent Şəbəkəsi</title><style>*{box-sizing:border-box}
:root{--bg:#f4f6fa;--card:#fff;--tx:#111827;--mu:#6b7280;--bd:#e5e7eb;--pr:#1d4ed8}
body{margin:0;font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx)}
a{color:var(--pr);text-decoration:none}a:hover{text-decoration:underline}
main{max-width:1200px;margin:0 auto;padding:20px}
h1{font-size:24px;margin:8px 0 4px}h2{font-size:17px;margin:0 0 12px}h3{font-size:15px;margin:16px 0 8px}
.muted{color:var(--mu)}
.top{display:flex;align-items:center;gap:20px;flex-wrap:wrap;background:#0f172a;color:#fff;padding:10px 20px}
.top a{color:#cbd5e1}.top .brand{color:#fff;font-weight:700;font-size:17px}
.top nav{display:flex;gap:4px;flex-wrap:wrap;flex:1}
.top nav a{padding:6px 12px;border-radius:8px}.top nav a.on,.top nav a:hover{background:#1e293b;color:#fff;text-decoration:none}
.top .who{font-size:14px}.top .who small{background:#334155;padding:2px 8px;border-radius:99px;margin:0 6px}
.dot{background:#ef4444;color:#fff;border-radius:99px;padding:0 7px;font-size:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:18px;margin-bottom:16px}
.narrow{max-width:420px;margin:40px auto}
.grid2{display:grid;grid-template-columns:1.6fr 1fr;gap:16px;margin-top:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:16px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;color:var(--tx);display:flex;flex-direction:column}
.stat b{font-size:28px}.stat span{color:var(--mu);font-size:13px}.stat small{color:var(--mu)}a.stat:hover{text-decoration:none;box-shadow:0 2px 8px #0001}
label{display:block;margin-bottom:12px;font-size:13px;color:#374151;font-weight:500}
input,select,textarea{display:block;width:100%;margin-top:4px;padding:9px 11px;border:1px solid #d1d5db;border-radius:8px;font:inherit;background:#fff}
input:focus,select:focus,textarea:focus{outline:2px solid #93c5fd;border-color:var(--pr)}
.row{display:flex;gap:12px}.row>*{flex:1}
.btn{display:inline-block;background:var(--pr);color:#fff;border:0;border-radius:8px;padding:9px 16px;font:inherit;font-weight:600;cursor:pointer}
.btn:hover{background:#1e40af;text-decoration:none}.btn.wide{width:100%}.btn.sm{padding:6px 12px;font-size:13px}
.btn.ghost{background:#e5e7eb;color:#111}.btn.danger{background:#dc2626}
.link{background:none;border:0;color:var(--pr);cursor:pointer;font:inherit;font-size:13px;padding:0 4px}
.flash{padding:10px 14px;border-radius:8px;margin:10px 0}.flash.ok{background:#dcfce7;color:#166534}.flash.err{background:#fee2e2;color:#991b1b}
.badge{padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap;vertical-align:middle}
.tbl{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--bd);vertical-align:top}
th{font-size:12px;color:var(--mu);text-transform:uppercase}tr[onclick]{cursor:pointer}tr[onclick]:hover{background:#f9fafb}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0}.filters input,.filters select{width:auto;margin:0}.filters input[name=s]{flex:1;min-width:200px}
.pager{margin-top:12px;display:flex;gap:4px;flex-wrap:wrap}.pager a{padding:4px 10px;border:1px solid var(--bd);border-radius:6px}.pager a.on{background:var(--pr);color:#fff}
.form{max-width:720px}
.drop{border:2px dashed #cbd5e1;border-radius:10px;padding:14px;background:#f8fafc}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 12px;margin:0}.kv dt{color:var(--mu)}.kv dd{margin:0;font-weight:500}
.note{background:#f8fafc;border-left:3px solid var(--pr);padding:10px 12px;border-radius:6px}
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.file{border:1px solid var(--bd);border-radius:10px;overflow:hidden;color:var(--tx);display:flex;flex-direction:column}
.file img{width:100%;height:100px;object-fit:cover;background:#eee}.file .ext{height:100px;display:grid;place-items:center;background:#eef2ff;font-weight:700;color:var(--pr);font-size:20px}
.file small{padding:6px 8px;word-break:break-all;font-size:11px}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}.seg label{margin:0}.seg input{display:none}
.seg span{display:inline-block;padding:7px 12px;border:1px solid var(--bd);border-radius:8px;cursor:pointer;font-weight:600;color:var(--c)}
.seg input:checked+span{background:var(--c);color:#fff;border-color:var(--c)}
.log{list-style:none;padding:0;margin:0 0 12px;font-size:14px}.log li{padding:8px 0;border-bottom:1px solid var(--bd)}
form.inline{display:inline}.card form.inline{display:flex;gap:8px}.card form.inline input{margin:0}
.top li,ol.top li{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--bd)}ol.top{padding-left:0;list-style:none;counter-reset:n}
.tree ul{list-style:none;padding-left:26px;margin:0;border-left:2px solid #e2e8f0}.tree>ul{padding-left:0;border:0}
.tree li{margin:6px 0}.node{padding:8px 10px;border:1px solid var(--bd);border-radius:10px;background:#fff;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.node.off{opacity:.5;background:#f3f4f6}.node .acts{margin-left:auto}.node form.inline{display:inline}
.role{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;text-transform:uppercase}
.r-founder{background:#fef3c7;color:#92400e}.r-admin{background:#dbeafe;color:#1e40af}.r-agent{background:#dcfce7;color:#166534}
.pill{font-size:12px;background:#f1f5f9;padding:2px 8px;border-radius:99px;color:#334155}
dialog{border:0;border-radius:14px;padding:22px;width:min(420px,92vw);box-shadow:0 20px 60px #0004}dialog::backdrop{background:#0006}
@media(max-width:800px){.top nav{order:3;flex:0 0 100%;flex-wrap:nowrap;overflow-x:auto}.top nav a{white-space:nowrap}.grid2{grid-template-columns:1fr}.row{flex-direction:column;gap:0}main{padding:12px}.top{gap:8px}.node .acts{margin-left:0;width:100%}}

.pair{display:flex;gap:6px;margin-top:4px}.pair select{width:90px;flex:none;margin:0}.pair input{margin:0}.up{text-transform:uppercase}.up::placeholder{text-transform:none}
.send{border:2px solid #16a34a;background:#f0fdf4}.send .big{font-size:20px;letter-spacing:1px}.btn.wa{background:#16a34a}.send .row{flex-wrap:wrap}
#cp{margin-top:10px}.btn.xl{background:#16a34a;margin-left:auto}
.copybox{margin-top:16px;border:2px solid #bfdbfe;background:#eff6ff;border-radius:10px;padding:12px}.copybox h3{margin:0 0 8px}
.crow{display:flex;align-items:center;gap:10px;padding:5px 0;border-bottom:1px dashed #cbd5e1}.crow:last-child{border:0}.crow>span{width:105px;color:#475569;font-size:13px;flex:none}
.chip{font:600 15px/1 ui-monospace,Consolas,monospace;background:#fff;border:1px solid #93c5fd;color:#1e3a8a;border-radius:8px;padding:8px 12px;margin:2px 6px 2px 0;cursor:pointer}
.chip:hover{background:#dbeafe}.chip.ok{background:#16a34a;border-color:#16a34a;color:#fff}.chip.ok::after{content:' ✓'}
.kv dd{display:flex;align-items:center;gap:8px}
.cpb{border:1px solid #cbd5e1;background:#fff;border-radius:6px;padding:1px 6px;font-size:12px;cursor:pointer;line-height:20px;opacity:.75}
.cpb:hover{opacity:1;background:#eff6ff;border-color:#93c5fd}.cpb.ok{background:#16a34a;border-color:#16a34a;color:#fff;opacity:1}
.kv{grid-template-columns:130px 1fr}
</style><link rel="manifest" href="/manifest.json"><meta name="theme-color" content="#0f172a">
<link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="icon" href="/icon-192.png">

<style>@media (max-width:700px){
 header.top{flex-wrap:wrap;padding-top:env(safe-area-inset-top)}
 header.top nav{order:3;width:100%;overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch;scrollbar-width:none}
 header.top nav::-webkit-scrollbar{display:none}
 header.top .who img{position:static !important;transform:none !important;margin:0 6px 0 0 !important;vertical-align:middle;width:26px !important;height:26px !important}
 header.top .who{display:flex;align-items:center;gap:4px;font-size:14px}
 input,select,textarea{font-size:16px !important}

}</style></head>
<body><div id="app"></div><script>// ===== Agent Şəbəkəsi — server versiyası (məlumat serverdə, MySQL) =====
const KEY = 'agentnet_v1';
const STATUSES = { yeni:['Yeni','#2563eb'], baxilir:['Baxılır','#d97706'], tesdiq:['Təsdiqləndi','#16a34a'], redd:['Rədd edildi','#dc2626'] };
const HIDDEN_ST = ['baxilir']; // artıq istifadə olunmur — yeri boş qalır (düymələr yerindən tərpənməsin)
const ROLES = { founder:'Qurucu', admin:'Admin', agent:'Agent' };
const ALLOWED = ['pdf','jpg','jpeg','png','webp','heic','doc','docx','xls','xlsx'];
const MAX_MB = 3;

// ---------- SERVER QATI ----------
const API = 'api.php', KINDS = ['users','docs','files','log','cfg','cars','camp'];
let BASE = {}, SRV = { hasUsers:false, rev:0, uid:0 };
function blank(){ return { users:[], docs:[], files:[], log:[], cfg:[], cars:[], seq:{u:0,d:0,f:0,l:0,c:0,k:0} }; }
function xhr(method, q, body){
  const x = new XMLHttpRequest(); x.open(method, API + '?' + q, false);
  if (body) x.setRequestHeader('Content-Type', 'application/json');
  try { x.send(body ? JSON.stringify(body) : null); return JSON.parse(x.responseText); }
  catch(e){ return { ok:false, err:'Serverlə əlaqə yoxdur. İnterneti yoxlayın.' }; }
}
function snap(st){ const b = { _fp: st.founderPreset || 0 }; for (const k of KINDS){ b[k] = {}; for (const r of st[k] || []) b[k][r.id] = JSON.stringify(r); } return b; }
function cacheForRobot(st){ try { localStorage.setItem(KEY, JSON.stringify({ docs: st.docs || [] })); } catch(e){} }
function setState(r){
  SRV.hasUsers = !!r.hasUsers; SRV.rev = r.rev || 0; SRV.uid = r.uid || 0;
  const st = r.state || blank(); st.cfg = st.cfg || []; st.cars = st.cars || []; st.camp = st.camp || []; BASE = snap(st); cacheForRobot(st);
  if (SRV.uid) sessionStorage.setItem('agentnet_uid', SRV.uid); else sessionStorage.removeItem('agentnet_uid');
  return st;
}
function load(){ const r = xhr('GET', 'a=state'); return r && r.ok ? setState(r) : (alert(r.err || 'Server xətası'), blank()); }
function diff(){
  const ch = {}, del = {}; let n = 0;
  for (const k of KINDS){ const b = BASE[k] || {}, cur = {};
    for (const r of S[k] || []) { cur[r.id] = 1; if (b[r.id] !== JSON.stringify(r)) { (ch[k] = ch[k] || []).push(r); n++; } }
    for (const id in b) if (!cur[id]) { (del[k] = del[k] || []).push(+id); n++; } }
  const meta = {}; if ((S.founderPreset || 0) !== (BASE._fp || 0)) { meta.founderPreset = S.founderPreset; n++; }
  return n ? { ch, del, meta } : null;
}
function save(){
  const d = diff(); if (!d) return true;
  const r = xhr('POST', 'a=sync', d);
  if (!r || !r.ok) { alert((r && r.err) || 'Yadda saxlanmadı'); S = load(); return false; }
  S = setState(r); return true;
}
const nid = k => { const r = xhr('GET', 'a=nid&k=' + k); if (!r || !r.ok) { alert((r && r.err) || 'Server xətası'); throw new Error('nid'); } return r.id; };
let S = load();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('/sw.js').catch(() => {});
// Yeni sənədlər / dəyişikliklər üçün serveri yoxla (2 san.)
// Arxa planda da yatmayan taymer (Web Worker) — Chrome gizli tabda adi taymerləri dəqiqədə 1 dəfəyə endirir
function wakeTick(fn, ms){ try { const w = new Worker(URL.createObjectURL(new Blob(['setInterval(()=>postMessage(0),' + ms + ')'], { type:'text/javascript' }))); w.onmessage = fn; } catch(e){ setInterval(fn, ms); } }
wakeTick(async () => {
  if (!SRV.uid) return;
  try {
    const r = await (await fetch(API + '?a=state&rev=' + SRV.rev + '&uid=' + SRV.uid, { cache:'no-store' })).json();
    if (!r.ok || r.same) return;
    if (diff()) { cacheForRobot(r.state || {}); return; } // saxlanmamış dəyişiklik var — yalnız robot üçün yaddaşı yenilə
    S = setState(r);
    const ae = document.activeElement, page = (location.hash.slice(1).split('?')[0] || 'home').split('/')[0];
    try { campNotify(); if (document.getElementById('kampFab')) kampFab(page); pdfFab(page); } catch(e){}
    const busy = (ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)) || document.querySelector('dialog[open]');
    if (!busy && ['home','docs','done','doc','team','kamp','pdf'].includes(page)) { const y = scrollY; render(); scrollTo(0, y); }
  } catch(e){}
}, 2000);
function newCode(){ let c; do { c = String(100000 + Math.floor(Math.random()*900000)); } while (S.users.some(u => u.code === c)); return c; }
S.docs.forEach(d => { if (d.status === 'baxilir') { d.status = 'yeni'; save(); } });
S.docs.forEach(d => { if (d.dqn && d.dqn.includes('-')) { const n = d.dqn.replace(/-/g, ''); d.title = d.title.replace(d.dqn, n); d.dqn = n; save(); } });
if (S.users.some(u => !u.code)) { S.users.forEach(u => { if (!u.code) u.code = newCode(); }); save(); }
const now = () => { const d=new Date(), p=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; };
const e = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function hash(pw){ const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('agentnet:'+pw)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''); }

const U = id => S.users.find(u => u.id === +id);
const me = () => { const id = +sessionStorage.getItem('agentnet_uid'); const u = U(id); return u && u.active ? u : null; };
const inBranch = (v, t) => t.path.startsWith(v.path);
const isF = u => u.role === 'founder';
const canSee = (v, d) => isF(v) || d.user_id === v.id;
const canReview = v => isF(v);
const roleName = u => u.role === 'agent' && u.depth > 3 ? 'Alt-agent' : ROLES[u.role];
const childRole = u => u.role === 'founder' ? 'admin' : 'agent';
const chain = path => path.split('/').filter(Boolean).map(id => e(U(id)?.name || '?')).join(' › ');
const badge = s => { const [t,c] = STATUSES[s]; return `<span class="badge" style="background:${c}1a;color:${c}">${t}</span>`; };
const branchDocs = u => S.docs.filter(d => canSee(u, d)).sort((a,b) => b.id - a.id);

const watchGet = () => +(sessionStorage.getItem('agentnet_watch') || 0);
const watchSet = id => id ? sessionStorage.setItem('agentnet_watch', id) : sessionStorage.removeItem('agentnet_watch');
function isbParts(d){
  const t = String(d.review_note || '').split(/\t|\n| {2,}/).map(x => x.trim()).filter(Boolean);
  return { pat: t.find(x => /^[A-Z]{2,5}\d{6,}$/.test(x)) || d.isb_code || '', dt: t.find(x => /^\d{2}\.\d{2}\.\d{4} \d{2}:\d{2}/.test(x)) || '',
    st: t.find(x => /gözləyir|ödənil|qüvvə/i.test(x)) || '', pay: t.find(x => /^\d{10,14}$/.test(x)) || '', sum: t.find(x => /^\d+\.\d{2}$/.test(x)) || '' };
}
function drawWatch(page){
  document.getElementById('watchBox')?.remove(); document.getElementById('dlApp')?.remove(); document.getElementById('calcFab')?.remove(); document.getElementById('kampFab')?.remove(); document.getElementById('pdfFab')?.remove();
  const id = watchGet(); if (!id || page === 'new') return;
  const d = S.docs.find(x => x.id === id); if (!d) return watchSet(0);
  const lastLog = S.log.filter(l => l.document_id === id).slice(-1)[0];
  const row = (k, v, big) => v ? `<div style="display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid #eee"><span style="width:120px;color:#6b7280">${k}</span><b style="${big ? 'font-size:22px;color:#16a34a' : ''}">${e(v)}</b><button class="wcp" data-v="${e(v)}" style="margin-left:auto;border:1px solid #ddd;background:#fff;border-radius:6px;cursor:pointer;padding:3px 8px">📋</button></div>` : '';
  let html;
  if (d.status === 'tesdiq') { const p = isbParts(d);
    html = `<div style="font-size:40px">✅</div><h2 style="margin:4px 0 2px">İSB-də imzalandı</h2><p class="muted" style="margin:0 0 10px">${e(d.dqn)}</p>
      ${row('Ödəniş kodu', p.pay, true)}${row('PAT kodu', p.pat)}${row('Tarix', p.dt)}${row('Status', p.st)}${row('Məbləğ', p.sum ? p.sum + ' AZN' : '')}${!p.pay && !p.pat && d.review_note ? `<p style="white-space:pre-wrap">${e(d.review_note)}</p>` : ''}`;
  } else if (d.status === 'redd') {
    html = `<div style="font-size:40px">❌</div><h2 style="margin:4px 0 2px">Rədd edildi</h2><p class="muted" style="margin:0 0 10px">${e(d.dqn)}</p>
      <p style="white-space:pre-wrap;background:#fef2f2;color:#991b1b;padding:10px;border-radius:8px">${e(d.review_note || 'Səbəb yazılmayıb')}</p>
      ${d.user_id === me()?.id ? `<a class="btn" href="#new?edit=${d.id}" id="wEdit" style="display:inline-block;margin-top:6px">Düzəlt və yenidən göndər</a>` : ''}`;
  } else {
    html = `<div class="wspin" style="width:46px;height:46px;border:5px solid #dbeafe;border-top-color:#2563eb;border-radius:50%;margin:0 auto 10px;animation:wsp 1s linear infinite"></div>
      <h2 style="margin:4px 0 2px">İSB-də doldurulur…</h2><p class="muted" style="margin:0">${e(d.dqn)} · ${e(d.created_at || '')}</p>
      <p style="margin:12px 0 0">${e(lastLog && /Robot/.test(lastLog.action) ? lastLog.action : 'Sənəd növbədədir, robot götürəcək.')}</p>
      <p class="muted" style="font-size:13px">Bu pəncərə nəticə gələn kimi özü yenilənəcək.</p>`;
  }
  document.body.insertAdjacentHTML('beforeend', `<div id="watchBox" style="position:fixed;inset:0;background:#0f172a99;z-index:9998;display:flex;align-items:center;justify-content:center">
    <style>@keyframes wsp{to{transform:rotate(360deg)}}</style>
    <div style="background:#fff;color:#111;border-radius:16px;padding:24px 26px;width:min(460px,92vw);text-align:center;box-shadow:0 20px 60px #0006">
      ${html}<div style="margin-top:14px"><button id="wClose" class="btn ghost" style="background:#e5e7eb;color:#111">Bağla</button></div></div></div>`);
  document.querySelectorAll('#watchBox .wcp').forEach(b => b.onclick = () => { const v = b.dataset.v;
    (navigator.clipboard ? navigator.clipboard.writeText(v) : Promise.reject()).then(() => b.textContent = '✓', () => prompt('Kopyalayın:', v)); });
  $('#wClose').onclick = () => { watchSet(0); document.getElementById('watchBox')?.remove(); };
  if ($('#wEdit')) $('#wEdit').onclick = () => watchSet(0);
}
// Qeyddəki İSB sətrindən əsas hissələr: PAT kodu, tarix-saat, status, DQN, ödəniş kodu, məbləğ
// Qeyddəki İSB sətrindən ödəniş kodu (məs. 400016134242)
function payCode(d){ const t = String(d.review_note || '').split(/\t|\n|\s+/).map(x => x.trim()); return t.find(x => /^\d{10,14}$/.test(x)) || ''; }
function isbLine(d){
  if (d.status !== 'tesdiq' || !d.review_note) return '';
  const t = String(d.review_note).split(/\t|\n| {2,}/).map(x => x.trim()).filter(Boolean);
  const pat = t.find(x => /^[A-Z]{2,5}\d{6,}$/.test(x)); if (!pat) return '';
  const dt = t.find(x => /^\d{2}\.\d{2}\.\d{4} \d{2}:\d{2}/.test(x)) || '';
  const st = t.find(x => /gözləyir|ödənil|edildi|qüvvə/i.test(x)) || '';
  const dqn = t.find(x => x.toUpperCase().replace(/[-\s]/g, '') === String(d.dqn || '').toUpperCase()) || d.dqn || '';
  const pay = t.find(x => /^\d{10,14}$/.test(x)) || '';
  const sum = t.find(x => /^\d+\.\d{2}$/.test(x)) || '';
  return [pat, dt, st, dqn, pay, sum].filter(Boolean).map(e).join(' · ');
}
function docTable(rows){
  if (!rows.length) return '<p class="muted">Sənəd yoxdur.</p>';
  return `<div class="tbl"><table><tr><th>#</th><th>Başlıq</th><th>Telefon</th><th>Göndərən</th><th>Status</th><th>Tarix</th></tr>${
    rows.map(d => `<tr onclick="location.hash='doc/${d.id}'"><td>${d.id}</td><td><a href="#doc/${d.id}">${e(d.title)}</a>${isbLine(d) ? `<br><small style="white-space:nowrap;color:#166534;font-weight:600">${isbLine(d)}</small>` : d.doc_type?`<br><small class="muted">${e(d.doc_type)}</small>`:''}</td>
      <td>${e((d.customer_phone || '').replace(/^0/, ''))}</td><td>${e(U(d.user_id)?.name || d.from_name)}</td><td>${badge(d.status)}</td><td><small>${d.created_at}</small></td></tr>`).join('')}</table></div>`;
}

    <form id="f"><label>Kod<input name="code" required autofocus autocomplete="username" autocapitalize="characters" autocorrect="off" spellcheck="false" placeholder="Giriş kodunuz"></label>
    <label>Parol<input type="password" name="password" required></label><button class="btn wide">Daxil ol</button></form></div></main>`;
  dlButton();
  $('#f').onsubmit = async ev => { ev.preventDefault(); const f = new FormData(ev.target);
    const k = f.get('code').trim().toUpperCase(); const r = xhr('POST', 'a=login', { code:k, pw: await hash(f.get('password')) });
    if (r && r.ok) { S = setState(r); go('#home'); }
    else $('#err').innerHTML = '<div class="flash err">Kod və ya parol səhvdir.</div>'; };

function pHome(u){
  const docs = branchDocs(u), today = now().slice(0,10), month = today.slice(0,7);
  const team = S.users.filter(x => inBranch(u,x) && x.id !== u.id);
  const cnt = {}; docs.filter(d => d.created_at.startsWith(month)).forEach(d => cnt[d.user_id] = (cnt[d.user_id]||0)+1);
  const top = Object.entries(cnt).sort((a,b) => b[1]-a[1]).slice(0,5);
  shell(u, 'home', `<h1>Salam, ${e(u.name)}</h1><p class="muted">Sizin budaq: ${chain(u.path)}</p>
    <div class="stats">
      <div class="stat"><b>${team.length}</b><span>Budaqdakı agentlər</span><small>${S.users.filter(x=>x.parent_id===u.id).length} birbaşa</small></div>
      <div class="stat"><b>${docs.filter(d=>d.created_at.startsWith(today)).length}</b><span>${isF(u) ? 'Bu gün gələn sənəd' : 'Bu gün göndərdim'}</span></div>
      ${Object.entries(STATUSES).map(([k,[t,c]]) => `<a class="stat" href="#docs?status=${k}" style="border-top:3px solid ${c}${HIDDEN_ST.includes(k) ? ';visibility:hidden' : ''}"><b>${docs.filter(d=>d.status===k).length}</b><span>${t}</span></a>`).join('')}
      <div class="stat"><b>${S.docs.filter(d=>d.user_id===u.id).length}</b><span>Özüm göndərdim</span></div>
    </div>
    <div class="grid2"><div class="card"><h2>${isF(u) ? 'Son gələn sənədlər' : 'Mənim son sənədlərim'}</h2>${docTable(docs.filter(d => !FIN_ST.includes(d.status)).slice(0,10))}<a href="#docs">Hamısına bax →</a></div>
      <div class="card">${isF(u) ? `<h2>Bu ayın ən aktivləri</h2>${top.length ? '' : '<p class="muted">Hələ sənəd yoxdur.</p>'}
        <ol class="top">${top.map(([id,c]) => `<li>${e(U(id)?.name)} <b>${c}</b></li>`).join('')}</ol>` : '<h2>Sənəd göndər</h2><p class="muted">Göndərdiyiniz sənədlər birbaşa qurucuya düşür.</p>'}
        <a class="btn" href="#new">+ Sənəd göndər</a>
        ${u.role==='founder' ? `<hr style="border:0;border-top:1px solid var(--bd);margin:16px 0"><h2>Ehtiyat nüsxə</h2>
          <button class="btn ghost sm" id="exp">JSON ixrac et</button> <button class="btn ghost sm" id="imp">JSON bərpa et</button>` : ''}
      </div></div>`);
  if (u.role === 'founder') { $('#exp').onclick = exportJSON; $('#imp').onclick = importJSON; }
}

const FIN_ST = ['tesdiq', 'redd']; // İcbari Sığorta bölməsi: təsdiqlənən + rədd edilən
function pDocs(u, qs, done = false){
  const wait = done === 'wait' && isF(u); if (done === 'wait') done = false;
  const st = qs.get('status') || '', s = (qs.get('s') || '').toLowerCase(), who = +(qs.get('who') || 0), from = qs.get('from') || '', to = qs.get('to') || '';
  let rows = branchDocs(u);
  // Təsdiqlənənlər ayrıca bölmədədir; əsas siyahıda yalnız işlənməmiş sənədlər
  if (done) rows = rows.filter(d => FIN_ST.includes(d.status)); else if (!FIN_ST.includes(st)) rows = rows.filter(d => !FIN_ST.includes(d.status));
  if (STATUSES[st]) rows = rows.filter(d => d.status === st);
  if (s) rows = rows.filter(d => [d.title,d.customer_name,d.customer_phone,d.customer_phone?.replace(/\D/g,''),d.doc_type,d.dqn,d.dqn?.replace(/-/g,''),d.fin,d.texpasport,d.id_card,d.license].some(x => (x||'').toLowerCase().includes(s)));
  if (isF(u) && who && U(who)) rows = rows.filter(d => d.path.startsWith(U(who).path));
  if (from) rows = rows.filter(d => d.created_at.slice(0,10) >= from);
  if (to) rows = rows.filter(d => d.created_at.slice(0,10) <= to);
  // Növbə: qurucuya sənədlər vaxt sırası ilə (ən birinci göndərilən) TƏK-TƏK çıxır, qalanları "Gözləmə"də yığılır
  const fifo = arr => arr.slice().sort((a, b) => (a.created_at || '').localeCompare(b.created_at || '') || a.id - b.id);
  const filtered = !!(st || s || who || from || to);
  let waitN = 0;
  if (isF(u) && !done) {
    const q = fifo(rows.filter(d => d.status === 'yeni'));
    if (wait) rows = [...q, ...rows.filter(d => d.status !== 'yeni')];
    else if (!filtered) { waitN = Math.max(0, q.length - 1); rows = q.slice(0, 1); }
  }
  const people = S.users.filter(x => inBranch(u,x)).sort((a,b) => a.path.localeCompare(b.path));
  shell(u, wait ? 'wait' : done ? 'done' : 'docs', `<h1>${wait ? '⏳ Gözləmədə' : done ? '🛡 İcbari Sığorta' : isF(u) ? 'Gələn sənədlər' : 'Mənim sənədlərim'} <small class="muted">(${rows.length}${waitN ? ` · növbədə daha ${waitN}` : ''})</small>${isF(u) && !done ? (wait ? ' <a href="#docs" style="font-size:15px">← Növbəti sənəd</a>' : ' <a href="#wait" style="font-size:15px">⏳ Gözləmə</a>') : ''}</h1>
    <form class="filters" id="flt"><input name="s" value="${e(qs.get('s')||'')}" placeholder="Axtar: DQN, FİN, telefon...">
      <select name="status"><option value="">Bütün statuslar</option>${Object.entries(STATUSES).filter(([k]) => !HIDDEN_ST.includes(k)).map(([k,[t]]) => `<option value="${k}" ${st===k?'selected':''}>${t}</option>`).join('')}</select>
      ${isF(u) ? `<select name="who"><option value="">Hamı</option>${people.map(p => `<option value="${p.id}" ${who===p.id?'selected':''}>${'— '.repeat(Math.max(0,p.depth-u.depth))}${e(p.name)}</option>`).join('')}</select>` : ''}
      <input type="date" name="from" value="${e(from)}"><input type="date" name="to" value="${e(to)}">
      <button class="btn">Süz</button> <a href="#${wait ? 'wait' : done ? 'done' : 'docs'}">Sıfırla</a>${isF(u) ? ' <button type="button" class="btn xl" id="xl">⬇ Excel ixrac</button>' : ''}</form>
    <div class="card">${docTable(rows)}</div>`);
  $('#flt').onsubmit = ev => { ev.preventDefault(); const p = new URLSearchParams();
    for (const [k,v] of new FormData(ev.target)) if (v) p.set(k, v); go((wait ? '#wait?' : done ? '#done?' : '#docs?') + p); };
  if (isF(u)) $('#xl').onclick = () => exportXlsx(rows);
}

function pNew(u, qs){
  const ed = qs && qs.get && qs.get('edit') ? S.docs.find(x => x.id === +qs.get('edit') && x.user_id === u.id) : null;
  const types = [...new Set(['İcbari sığorta','Könüllü sığorta','KASKO','Əmlak sığortası','Müqavilə','Ərizə', ...S.docs.map(d=>d.doc_type).filter(Boolean)])];
  shell(u, 'new', `<h1>${ed ? '✏ Düzəlt və yenidən göndər — #' + ed.id : 'Sənəd göndər'}</h1>${ed && ed.review_note ? `<div class="flash err">Səbəb: ${e(ed.review_note)}</div>` : ''}<p class="muted">${isF(u) ? 'Sənəd sizin siyahınıza əlavə olunacaq.' : 'Göndərdiyiniz sənəd birbaşa qurucuya düşür.'}</p><div id="err"></div>
    <form class="card form" id="f">
      <div class="row"><label>DQN *<input name="dqn" required class="up" placeholder="99NR324" pattern="\\d{2}-?[A-Za-z]{2}-?\\d{3}" title="Format: 99NR324"></label>
        <label>Texpasportun seriyası *<input name="texpasport" required class="up" placeholder="AB123456" pattern="[A-Za-z]{2}\\s?\\d{6}" title="2 hərf + 6 rəqəm, məs. AB123456"></label></div>
      <div class="row"><label style="position:relative"><span id="finTxt">FİN kod *</span><span id="psnBox" style="position:absolute;right:0;top:-3px;display:inline-flex;border:1px solid #c7d2fe;border-radius:8px;overflow:hidden;font-size:12px;font-weight:600"><button type="button" data-psn="fiz" style="border:0;padding:3px 10px;cursor:pointer">👤 Fiziki</button><button type="button" data-psn="huq" style="border:0;padding:3px 10px;cursor:pointer">🏢 Hüquqi</button></span><input name="fin" required class="up" maxlength="7" placeholder="5ABC12D" pattern="[A-Za-z0-9]{7}" title="7 simvol"><input name="voen" inputmode="numeric" maxlength="10" placeholder="1234567890" pattern="\\d{10}" title="VÖEN: 10 rəqəm" style="display:none"><input type="hidden" name="psn" value="fiz"></label>
        <label>Doğum tarixi *<input type="date" name="birth" required max="${now().slice(0,10)}"></label></div>
      <div class="row"><label>Şəxsiyyət vəsiqəsi *<span class="pair"><select name="id_ser" required><option>AZE</option><option>AA</option><option>AB</option></select>
          <input name="id_no" required inputmode="numeric" pattern="\\d{6,9}" placeholder="12345678" title="Yalnız rəqəm"></span></label>
        <label id="dlLab" style="position:relative">Sürücülük vəsiqəsi (prava) <span id="dlStar">*</span><span id="noDlBox" style="position:absolute;right:0;top:0;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;font-weight:600;cursor:pointer;user-select:none;color:#b91c1c"><input type="checkbox" name="no_dl" style="width:16px;height:16px;margin:0;flex:none">Pravası yoxdur</span><span class="pair"><input name="dl_ser" required class="up" maxlength="3" placeholder="AB" pattern="[A-Za-z]{2,3}" title="Seriya: 2-3 hərf, məs. AB, AC" style="width:90px;flex:none;margin:0;text-transform:uppercase">
          <input name="dl_no" required inputmode="numeric" pattern="\\d{6}" placeholder="123456" title="6 rəqəm"></span></label></div>
      <div class="row"><label>Telefon nömrəsi *<span class="pair"><select name="op" required><option value="">Kod</option>${['010','050','051','055','060','070','077','099'].map(x=>`<option>${x}</option>`).join('')}</select>
          <input name="phone_no" required inputmode="numeric" maxlength="7" pattern="\\d{7}" placeholder="1234567" title="7 rəqəm"></span></label>
        <label>Sənəd növü<input name="doc_type" list="types"><datalist id="types">${types.map(t=>`<option value="${e(t)}">`).join('')}</datalist></label></div>
      <label>Qeyd<textarea name="note" rows="3"></textarea></label>
      <label class="drop">Fayllar (şəkil, PDF, Word, Excel — hər biri max ${MAX_MB} MB)
        <input type="file" name="files" multiple accept="${ALLOWED.map(x=>'.'+x).join(',')}" id="fi"><span id="fl" class="muted">Telefondan birbaşa şəkil çəkə bilərsiniz</span></label>
      <button class="btn wide">Göndər ↑</button></form>`);
  $('#fi').onchange = ev => $('#fl').textContent = [...ev.target.files].map(f=>f.name).join(', ');
  if (ed) { // köhnə məlumatları doldur
    const F = $('#f'), sn = v => { const m = (v || '').match(/^([A-Z]+)(\d+)$/); return m ? [m[1], m[2]] : ['', v || '']; };
    const [is, ino] = sn(ed.id_card), [ds, dno] = sn(ed.license), [op, pn] = (ed.customer_phone || ' ').split(' ');
    Object.entries({ dqn: ed.dqn, texpasport: ed.texpasport, fin: ed.fin, birth: ed.birth, id_ser: is, id_no: ino, dl_ser: ds, dl_no: dno, op, phone_no: pn, doc_type: ed.doc_type, note: ed.note })
      .forEach(([k, v]) => { if (F[k] && v) F[k].value = v; });
    F.querySelector('button.btn').textContent = 'Düzəlt və yenidən göndər ↑';
  }
  const psnSet = v => { const F = $('#f'), huq = v === 'huq'; F.psn.value = v;
    document.querySelectorAll('[data-psn]').forEach(b => { const on = b.dataset.psn === v; b.style.background = on ? '#1d4ed8' : '#fff'; b.style.color = on ? '#fff' : '#1e293b'; });
    $('#finTxt').textContent = huq ? 'VÖEN *' : 'FİN kod *'; F.fin.style.display = huq ? 'none' : ''; F.voen.style.display = huq ? '' : 'none';
    F.fin.required = !huq; F.voen.required = huq;
    ['birth','id_ser','id_no'].forEach(n => { const el = F[n]; el.required = !huq; el.disabled = huq; el.style.opacity = huq ? .4 : 1; });
    $('#noDlBox').style.visibility = huq ? 'hidden' : 'visible';
    if (huq) ['dl_ser','dl_no'].forEach(n => { const el = F[n]; el.required = false; el.disabled = true; el.style.opacity = .4; }); else dlSync(); };
  const noDl = $('#f').no_dl, dlSync = () => { const on = noDl.checked; ['dl_ser','dl_no'].forEach(n => { const el = $('#f')[n]; el.required = !on; el.disabled = on; if (on) el.value = ''; el.style.opacity = on ? .4 : 1; }); $('#dlStar').style.visibility = on ? 'hidden' : 'visible'; };
  $('#noDlBox').onclick = ev => { ev.preventDefault(); ev.stopPropagation(); noDl.checked = !noDl.checked; dlSync(); };
  if (ed && ed.no_license) { noDl.checked = true; } dlSync();
  document.querySelectorAll('[data-psn]').forEach(b => b.onclick = () => psnSet(b.dataset.psn));
  if (ed && ed.person === 'huq') $('#f').voen.value = ed.voen || '';
  psnSet(ed && ed.person === 'huq' ? 'huq' : 'fiz');
  $('#f').onsubmit = async ev => { ev.preventDefault();
    const f = new FormData(ev.target), files = [...$('#fi').files], err = m => $('#err').innerHTML = `<div class="flash err">${e(m)}</div>`;
    for (const x of files) {
      if (!ALLOWED.includes(x.name.split('.').pop().toLowerCase())) return err(`“${x.name}” — bu fayl növünə icazə yoxdur.`);
      if (x.size > MAX_MB*1048576) return err(`“${x.name}” ${MAX_MB} MB-dan böyükdür.`);
    }
    const up = k => String(f.get(k) || '').trim().toUpperCase().replace(/\s+/g, '');
    const huq = f.get('psn') === 'huq';
    const P = huq ? { person:'huq', voen:up('voen'), fin:'', birth:'', id_card:'', license:'', no_license:false }
                  : { person:'fiz', voen:'', fin:up('fin'), birth:f.get('birth'), id_card:f.get('id_ser') + up('id_no'), license:f.get('no_dl') ? '' : up('dl_ser') + up('dl_no'), no_license:!!f.get('no_dl') };
    const dqn = up('dqn').replace(/-/g, '');
    if (ed) { // mövcud sənədi yenilə → yenidən "Yeni"
      Object.assign(ed, { title: dqn + (f.get('doc_type').trim() ? ' — ' + f.get('doc_type').trim() : ''), dqn, texpasport:up('texpasport'), ...P, doc_type:f.get('doc_type').trim(), customer_phone:`${f.get('op')} ${up('phone_no')}`,
        note:f.get('note').trim(), status:'yeni', review_note:'', ver:(ed.ver || 0) + 1 });
      for (const x of files) {
        const data = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(x); });
        S.files.push({ id:nid('f'), document_id:ed.id, name:x.name, mime:x.type, size:x.size, data });
      }
      logAdd(ed.id, u.id, 'düzəltdi və yenidən göndərdi');
      if (!save()) { S = load(); return; }
      toast('Düzəldildi və yenidən göndərildi.'); watchSet(ed.id); return go('#docs');
    }
    const id = nid('d');
    S.docs.push({ id, user_id:u.id, path:u.path, title: dqn + (f.get('doc_type').trim() ? ' — ' + f.get('doc_type').trim() : ''),
      dqn, texpasport:up('texpasport'), ...P,
      doc_type:f.get('doc_type').trim(), customer_name:'',
      customer_phone:`${f.get('op')} ${up('phone_no')}`, amount:null, note:f.get('note').trim(), status:'yeni',
      reviewed_by:null, review_note:'', created_at:now() });
    for (const x of files) {
      const data = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(x); });
      S.files.push({ id:nid('f'), document_id:id, name:x.name, mime:x.type, size:x.size, data });
    }
    logAdd(id, u.id, 'göndərdi');
    if (!save()) { S = load(); return; }
    toast(isF(u) ? 'Sənəd əlavə edildi.' : 'Sənəd göndərildi — qurucuya düşdü.'); watchSet(id); go('#docs'); };
}

// ---------- PDF: təsdiqlənmiş sənəd üçün agent qurucudan PDF istəyir, qurucu yükləyir ----------
const PDF_MB = 4;
const pdfOf = d => d.pdf_file ? S.files.find(f => f.id === d.pdf_file) : null;
function pdfCtl(u, d){
  if (d.status !== 'tesdiq') return '';
  const b = (id, txt, bg) => `<button type="button" id="${id}" style="position:absolute;right:0;top:50%;transform:translateY(-50%);border:0;border-radius:10px;padding:8px 14px;font-size:14px;font-weight:700;cursor:pointer;color:#fff;background:${bg}">${txt}</button>`;
  const pf = pdfOf(d), css = '<style>@media(max-width:700px){#pdfUp,#pdfGet,#pdfAsk,#pdfWait{position:static!important;transform:none!important;display:block;margin-top:8px}}</style>';
  if (isF(u)) return css + b('pdfUp', pf ? '📄 PDF dəyiş' : d.pdf_req ? '📄 PDF yüklə — istənilir!' : '📄 PDF yüklə', pf ? '#64748b' : d.pdf_req ? '#dc2626' : '#1d4ed8') + '<input type="file" id="pdfIn" accept="application/pdf,.pdf" hidden>';
  if (pf) return css + b('pdfGet', '📄 PDF endir', '#16a34a');
  if (d.pdf_req) return css + b('pdfWait', '⏳ PDF istənildi', '#94a3b8');
  return css + b('pdfAsk', '📄 PDF istə', '#1d4ed8');
}
function pdfWire(u, d){
  if (d.status !== 'tesdiq') return;
  const pf = pdfOf(d);
  if (pf && !isF(u) && d.user_id === u.id && !d.pdf_seen) { d.pdf_seen = true; save(); }
  if ($('#pdfAsk')) $('#pdfAsk').onclick = () => { d.pdf_req = now(); d.pdf_req_by = u.id; logAdd(d.id, u.id, 'PDF istədi'); save(); toast('PDF istəyi qurucuya göndərildi.'); render(); };
  if ($('#pdfGet')) $('#pdfGet').onclick = () => { const l = document.createElement('a'); l.href = pf.data; l.download = pf.name; l.click(); };
  if ($('#pdfUp')) { $('#pdfUp').onclick = () => $('#pdfIn').click();
    $('#pdfIn').onchange = async ev => { const x = ev.target.files[0]; if (!x) return;
      if (!/\.pdf$/i.test(x.name) && x.type !== 'application/pdf') return alert('Yalnız PDF faylı seçin.');
      if (x.size > PDF_MB * 1048576) return alert(`PDF ${PDF_MB} MB-dan böyük olmamalıdır.`);
      const data = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(x); });
      if (pf) S.files = S.files.filter(f => f.id !== pf.id);
      const fid = nid('f'); S.files.push({ id:fid, document_id:d.id, name:x.name, mime:'application/pdf', size:x.size, data, pdf:true });
      d.pdf_file = fid; d.pdf_at = now(); d.pdf_seen = false; logAdd(d.id, u.id, 'PDF yüklədi', x.name);
      if (!save()) { S = load(); return; } toast('PDF yükləndi — agent görəcək.'); render(); };
  }
}
const pdfList = u => isF(u) ? S.docs.filter(d => d.status === 'tesdiq' && (d.pdf_req || d.pdf_file))
                             : S.docs.filter(d => d.user_id === u.id && d.status === 'tesdiq' && (d.pdf_req || d.pdf_file));
const pdfN = u => isF(u) ? S.docs.filter(d => d.status === 'tesdiq' && d.pdf_req && !d.pdf_file).length
                         : S.docs.filter(d => d.user_id === u.id && d.status === 'tesdiq' && d.pdf_file && !d.pdf_seen).length;
// PDF-lər bölməsi: istənilən sənədlər bura düşür; qurucu yalnız PDF yükləyir, kim istəyibsə o endirir
function pPdf(u){
  const list = pdfList(u).sort((a, b) => (!!a.pdf_file - !!b.pdf_file) || (b.pdf_req || '').localeCompare(a.pdf_req || ''));
  const row = d => { const pf = pdfOf(d);
    const act = isF(u) ? `<button class="btn sm" data-up="${d.id}" style="background:${pf ? '#64748b' : '#dc2626'}">${pf ? '📄 PDF dəyiş' : '📄 PDF yüklə'}</button>`
      : pf ? `<button class="btn sm" data-get="${d.id}" style="background:#16a34a">📄 PDF endir${d.pdf_seen ? '' : ' • yeni'}</button>` : '<span class="muted">⏳ Gözlənilir</span>';
    return `<tr><td>${d.id}</td><td><a href="#doc/${d.id}">${e(d.title)}</a>${isbLine(d) ? `<br><small style="color:#166534;font-weight:600">${isbLine(d)}</small>` : ''}</td>
      <td>${e(U(d.pdf_req_by || d.user_id)?.name || d.from_name || '')}</td><td><small>${e(d.pdf_req || '')}</small></td>
      <td>${pf ? `<small style="color:#16a34a">✓ ${e(pf.name)}</small>` : '<small style="color:#dc2626">yüklənməyib</small>'}</td><td>${act}</td></tr>`; };
  shell(u, 'pdf', `<h1>📄 PDF-lər <small class="muted">(${list.length})</small></h1>

// Sadə ZIP (sıxılmadan) — kitabxanasız
function zipStore(files){
  const enc = new TextEncoder(), crcT = new Uint32Array(256).map((_, n) => { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; return c >>> 0; });
  const crc = b => { let c = 0xFFFFFFFF; for (const x of b) c = crcT[(c ^ x) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
  const parts = [], central = []; let off = 0;
  for (const [name, txt] of Object.entries(files)) {
    const nb = enc.encode(name), db = enc.encode(txt), c = crc(db);
    const h = new DataView(new ArrayBuffer(30)); h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true);
    h.setUint32(14, c, true); h.setUint32(18, db.length, true); h.setUint32(22, db.length, true); h.setUint16(26, nb.length, true);
    parts.push(h, nb, db);
    const ch = new DataView(new ArrayBuffer(46)); ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true);
    ch.setUint32(16, c, true); ch.setUint32(20, db.length, true); ch.setUint32(24, db.length, true); ch.setUint16(28, nb.length, true); ch.setUint32(42, off, true);
    central.push(ch, nb); off += 30 + nb.length + db.length;
  }
  const csize = central.reduce((s, p) => s + p.byteLength, 0), end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, Object.keys(files).length, true); end.setUint16(10, Object.keys(files).length, true);
  end.setUint32(12, csize, true); end.setUint32(16, off, true);
  return new Blob([...parts, ...central, end], { type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
}

    { type:'qosqu', tow:false, ban:true, note:'Dartıcısız QADAĞA' },
    { type:'qosqu', tow:true, pct:10 },
    { type:'texnika', pct:10 },
    // Əmlak, Yaşıl kart
    { type:'emlak', person:'fiz', pct:25, note:'İcbari — fiziki şəxslər' },
    { type:'emlak', person:'huq', pct:25, note:'İcbari — hüquqi şəxslər' },
    { type:'yasil', pct:15 },
  ]},
]};
const TYPES = { minik:'Minik', yuk:'Yük', avtobus:'Avtobus', motosikl:'Motosikl', qosqu:'Qoşqu', texnika:'Ağır / xüsusi texnika', serhed:'Sərhəd', emlak:'Əmlak (icbari)', yasil:'Yaşıl kart' };
const NO_CAR = ['emlak', 'yasil'];

const cfgNow = () => { const c = (S.cfg || []).find(x => x.id === 1); return c && c.ver === CFG_VER ? c : DEFAULT_CFG; };
const nrm = x => String(x || '').replace(/[İI]/g, 'i').replace(/ı/g, 'i').toLowerCase().replace(/[\s\-()]/g, '');
const makeHit = (list, make) => (list || []).some(m => nrm(make).includes(nrm(m)) || (nrm(m) && nrm(m).includes(nrm(make)) && nrm(make).length > 2));
const modelHit = (list, model) => !!nrm(model) && (list || []).some(m => nrm(model).includes(nrm(m)));
const regHit = (list, reg) => (list || []).some(r => r === reg || (REG_GROUPS[r] || []).includes(reg));
const inBanOf = (co, q) => q.person === 'fiz' && (makeHit(co.banMakes, q.make) || (co.banPairs || []).some(([mk, md]) => makeHit([mk], q.make) && modelHit([md], q.model)));
function ruleFor(co, q){
  const inBan = inBanOf(co, q);
  for (const r of co.rules || []) {
    if (r.type !== q.type) continue;
    if (r.person && r.person !== q.person) continue;
    if (r.banList && !inBan) continue;
    if (!r.banList && inBan && q.type === 'minik' && (co.rules || []).some(x => x.banList)) continue;
    if (r.electric != null && !!r.electric !== !!q.electric) continue;
    if (r.electric == null && q.electric && q.type === 'minik' && (co.rules || []).some(x => x.type === 'minik' && x.electric && (!x.person || x.person === q.person) && !!x.banList === inBan)) continue;
    if (r.makes && !makeHit(r.makes, q.make)) continue;
    if (r.models && !modelHit(r.models, q.model)) continue;
    if (r.yearMin && !(q.year >= r.yearMin)) continue;
    if (r.yearMax && !(q.year && q.year <= r.yearMax)) continue;
    if (r.tow != null && !!r.tow !== !!q.tow) continue;
    if (r.makesNot && makeHit(r.makesNot, q.make)) continue;
    if (r.regions && !regHit(r.regions, q.region)) continue;
    if (r.regionsNot && regHit(r.regionsNot, q.region)) continue;
    if (q.type === 'minik' && !q.electric && r.ccMin != null && !(q.cc >= r.ccMin && q.cc <= r.ccMax)) continue;
    if (q.type === 'yuk' && r.kgMin != null && !(q.kg >= r.kgMin && q.kg <= r.kgMax)) continue;
    if (q.type === 'avtobus' && r.seatMin != null && !(q.seats >= r.seatMin && q.seats <= r.seatMax)) continue;
    if (r.premMax != null || r.premMin != null) {
      if (!q.premium) return { pending:true, note:'Sığorta haqqını yazın (' + (r.note || '') + ')' };
      if (r.premMax != null && !(q.premium <= r.premMax)) continue;
      if (r.premMin != null && !(q.premium >= r.premMin)) continue;
    }
    return r;
  }
  return null;
}
function calcAll(q, cut){
  return cfgNow().companies.map(co => {
    if (co.pendingAll) return { co: co.name, st: 'wait', note: co.pendingAll };
    if (co.huqIndividual && q.person === 'huq' && !NO_CAR.includes(q.type)) return { co: co.name, st: 'wait', note: co.huqIndividual };
    if ((co.hardBan || []).some(([mk, md]) => makeHit([mk], q.make) && modelHit([md], q.model)))
      return { co: co.name, st: 'ban', note: 'Qəti qadağandır', fine: co.hardFine };
    if (inBanOf(co, q) && !(co.rules || []).some(x => x.banList)) return { co: co.name, st: 'ban', note: 'Qadağan olunmuş marka' };
    let r = ruleFor(co, q);
    if (!r) return { co: co.name, st: 'wait', note: 'Bu hal üçün tarif yoxdur' };
    if (r.ban) return { co: co.name, st: 'ban', note: r.note || 'Qadağa' };
    if (r.pending) return { co: co.name, st: 'wait', note: r.note || 'Məlumat gözlənilir' };
    let lim = '';
    if (r.premLimit != null) {
      if (!q.premium) return { co: co.name, st: 'wait', note: `Sığorta haqqını yazın: ${r.premLimit} AZN-ə qədər — ${r.below}%, yuxarı — ${r.above}%` };
      r = Object.assign({}, r, { pct: q.premium <= r.premLimit ? r.below : r.above });
      lim = `Limit ${r.premLimit} AZN: haqq ${q.premium <= r.premLimit ? 'limitə qədər' : 'limitdən yuxarı'}`;
    }
    let fine = false, usedDef = false;
    if (r.maxPct != null) { // ATƏŞGAH Excel düsturu
      const pr = q.premium || r.defPrem; usedDef = !q.premium && !!r.defPrem;
      if (!pr) return { co: co.name, st: 'wait', note: 'Sığorta haqqını yazın' };
      const M = r.maxPct / 100, comm = pr * (1 - M) > r.gross ? pr * M : pr - r.gross;
      fine = comm < 0;
      r = Object.assign({}, r, { pct: +(comm / pr * 100).toFixed(2), premium: pr });
    }
    if (r.moto != null) {
      const pr = q.premium || r.defPrem; usedDef = !q.premium;
      r = Object.assign({}, r, { pct: pr < r.moto ? +((pr - r.moto) / pr * 100).toFixed(2) : 0, premium: pr });
      fine = pr < r.moto;
    }
    const base = r.pct != null ? +r.pct : null;
    const pct = base == null ? null : (base > 0 ? Math.max(0, +(base - cut).toFixed(2)) : base);
    const prem = q.premium || r.premium || null;
    let amt = null;
    if (pct != null && prem) amt = +(prem * pct / 100).toFixed(2);
    else if (r.amount != null && !cut) amt = r.amount;
    return { co: co.name, st: 'ok', pct, prem, amt, note: [r.note, lim, fine ? 'Cərimə ödəyəcəksən' : '', usedDef ? 'haqq cədvəldən götürüldü — dəqiq hesab üçün haqqı yazın' : ''].filter(Boolean).join(' · ') };
  });
}
// istifadəçinin yuxarıdan çıxılan cəmi faizi
function myCutOf(u){
  if (!u || isF(u)) return 0;
  if (S.myCut != null && typeof SRV !== 'undefined') return +S.myCut || 0;
  let t = 0, x = u; while (x && !isF(x)) { t += +(x.cut || 0); x = U(x.parent_id); } return t;
}

</div>
      <div id="fTow" hidden><label><input type="checkbox" name="tow" style="width:auto"> Dartıcı (yük maşını) ilə birlikdə sığortalanır</label></div>

        <label style="align-self:end"><input type="checkbox" name="electric" style="width:auto"> Elektromobil</label></div></div>

      <div id="fSeat" hidden><label>Sərnişin yerlərinin sayı *<input name="seats" type="number" min="1" max="200" placeholder="məs. 18"></label></div>

      <label id="fReg">Qeydiyyat ünvanı *<input name="region" list="dlReg" required placeholder="Yazın: məs. Sumqayıt"></label><datalist id="dlReg">${opt(REGIONS)}</datalist>
      <label>Sığorta haqqı (AZN) <small class="muted">(bilirsinizsə — məbləği hesablamaq üçün)</small><input name="premium" type="number" min="0" step="0.01"></label>
      <button class="btn wide">Hesabla</button></form></div>
      <div class="card"><h2 style="margin-top:0">Nəticə</h2><div id="cRes" class="muted">Məlumatları doldurub "Hesabla" basın.</div></div></div>
    <dialog id="dCar"><form id="fCar"><h2>Yeni marka / model</h2>
      <label>Marka<input name="make" list="dlMake" required></label><label>Model<input name="model" required></label>
      <div class="row"><button class="btn">Əlavə et</button><button type="button" class="btn ghost" onclick="dCar.close()">Ləğv et</button></div></form></dialog>
    ${F ? `<div class="card" style="margin-top:16px"><h2 style="margin-top:0">Agentlərin əlavə etdiyi markalar (${cars.length})</h2>
      ${cars.length ? `<table><tr><th>Marka</th><th>Model</th><th>Əlavə edən</th><th>Tarix</th><th></th></tr>${cars.slice().reverse().map(k => `<tr><td>${e(k.make)}</td><td>${e(k.model)}</td><td>${e(U(k.user_id)?.name || '—')}</td><td>${e(k.created_at || '')}</td><td>${k.ok ? '✓ təsdiq' : `<button class="link" data-okcar="${k.id}">təsdiqlə</button>`} <button class="link" data-delcar="${k.id}" style="color:#dc2626">sil</button></td></tr>`).join('')}</table>` : '<p class="muted">Hələ yoxdur.</p>'}</div>
      <div class="card" style="margin-top:16px"><h2 style="margin-top:0">Tariflər (şirkətlər və qaydalar)</h2>
      <p class="muted" style="font-size:13px">Şirkət əlavə etmək, faizləri və qadağa markalarını (<b>banMakes</b>) dəyişmək üçün aşağıdakı mətni redaktə edib saxlayın. Qaydalar yuxarıdan aşağı yoxlanılır — birinci uyğun gələn tətbiq olunur.</p>
      <textarea id="cfgTxt" style="width:100%;min-height:260px;font-family:monospace;font-size:12px">${e(JSON.stringify({ companies: cfgNow().companies }, null, 1))}</textarea>
      <div class="row"><button class="btn" id="cfgSave" type="button">Tarifləri saxla</button><button class="btn ghost" id="cfgReset" type="button">Standarta qaytar</button></div></div>` : ''}`);
  const f = $('#cf'), typeSel = f.type;
  const sync = () => { const t = typeSel.value;
    $('#fCc').hidden = t !== 'minik'; $('#fKg').hidden = t !== 'yuk'; $('#fSeat').hidden = t !== 'avtobus';
    f.cc.required = t === 'minik' && !f.electric.checked; f.kg.required = t === 'yuk'; f.seats.required = t === 'avtobus';
    const car = !NO_CAR.includes(t); $('#fCar1').hidden = !car; $('#fReg').style.display = car ? '' : 'none'; f.make.required = f.model.required = f.region.required = car;
    $('#fYear').style.display = car ? '' : 'none'; f.year.required = car; $('#fTow').hidden = t !== 'qosqu'; };

  const fillModels = () => { const mk = allMakes.find(x => nrm(x) === nrm(f.make.value)) || f.make.value;
    $('#dlModel').innerHTML = opt([...new Set([...(CARS[mk] || []), ...(extraMakes[mk] || [])])]); };
  f.make.oninput = fillModels; f.make.onchange = fillModels;

    S.cars = S.cars || []; S.cars.push({ id: nid('k'), make: known, model: md, user_id: u.id, created_at: now(), ok: isF(u) });
    const mv = { person: f.person.value, type: f.type.value, year: f.year.value, tow: f.tow.checked, cc: f.cc.value, kg: f.kg.value, seats: f.seats.value, region: f.region.value, premium: f.premium.value, electric: f.electric.checked };
    save(); toast('Əlavə edildi: ' + known + ' ' + md); render();

    if (car && !reg) return $('#cRes').innerHTML = '<div class="flash err">Qeydiyyat ünvanını siyahıdan seçin.</div>';
    let cc0 = +String(f.cc.value).replace(',', '.') || 0, kg0 = +String(f.kg.value).replace(',', '.') || 0;
    if (cc0 > 0 && cc0 < 20) { cc0 = Math.round(cc0 * 1000); f.cc.value = cc0; } // litr yazılıbsa (2.8 → 2800)
    if (kg0 > 0 && kg0 < 100) { kg0 = Math.round(kg0 * 1000); f.kg.value = kg0; } // ton yazılıbsa (7.5 → 7500)
    const q = { person: f.person.value, type: f.type.value, make: f.make.value.trim(), model: f.model.value.trim(), cc: cc0, kg: kg0,
      seats: +f.seats.value || 0, region: reg, electric: f.electric.checked, premium: +f.premium.value || 0, year: +f.year.value || 0, tow: f.tow.checked };
    const res = calcAll(q, myCutOf(u));
    $('#cRes').innerHTML = `<p class="muted" style="margin-top:0">${car ? e(q.make) + ' ' + e(q.model) + ' · ' : ''}${TYPES[q.type]}${q.type === 'minik' ? (q.electric ? ' · Elektromobil' : ' · ' + q.cc + ' sm³') : q.type === 'yuk' ? ' · ' + q.kg + ' kq' : q.type === 'avtobus' ? ' · ' + q.seats + ' yer' : ''} ${car ? ' · İstehsal ili: ' + q.year + ' · ' + e(reg) : ''} · ${q.person === 'fiz' ? 'Fiziki' : 'Hüquqi'}</p>
      <table><tr><th>Şirkət</th><th>Vəziyyət</th><th>Komissiya</th><th>Məbləğ</th></tr>${res.map(r => `<tr><td><b>${e(r.co)}</b>${r.note ? `<br><small class="muted">${e(r.note)}</small>` : ''}</td>
        <td>${r.st === 'ok' ? ((r.pct != null && r.pct < 0) || (r.amt != null && r.amt < 0) ? '<b style="color:#dc2626">❌ Olmaz</b>' : '✅ Olar') : r.st === 'ban' ? '<b style="color:#dc2626">❌ Qadağa</b>' : '⏳ Məlumat yoxdur'}</td>
        <td>${r.st === 'ok' && r.pct != null ? `<b style="font-size:1.15em;color:${r.pct < 0 ? '#dc2626' : '#16a34a'}">${r.pct}%</b>` : '—'}</td>
        <td>${r.st === 'ok' && r.amt != null ? `<span style="${r.amt < 0 ? 'color:#dc2626;font-weight:700' : ''}">${r.amt} AZN</span>${r.prem ? `<br><small class="muted">haqq: ${r.prem} AZN</small>` : ''}` : r.fine ? `<b style="color:#dc2626">${r.fine} AZN</b><br><small class="muted">cərimə</small>` : '—'}</td></tr>`).join('')}</table>`; };

}
